<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Analysis Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <h1>Sentiment Analysis Results for "{{ keyword }}"</h1>
  <ul>
    {% for tweet, sentiment in results %}
    <li>
      <strong>Tweet:</strong> {{ tweet }} <br>
      <strong>Sentiment:</strong> {{ sentiment[0]['label'] }} <br>
      <strong>Score:</strong> {{ sentiment[0]['score'] }}
    </li>
    {% endfor %}
  </ul>
  <a href="/">Go Back</a>
</body>

</html>
